; Accu-Vis NPC/NPA Stepper Rail Controller
; https://docs.platformio.org/page/projectconf.html
;
; Board: NodeMCU 1.0 (ESP-12E) -- the most common ESP8266 dev board.
; If you have a different one (Wemos D1 Mini, ESP-01, etc.), tell me and
; I'll switch `board` below (run `platformio boards espressif8266` to list
; every supported ESP8266 board id).

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; Don't let the serial monitor drive the CH340's DTR/RTS lines: on many
; NodeMCU boards that holds the ESP8266 in reset, so nothing ever prints.
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    waspinator/AccelStepper@^1.64
    bblanchon/ArduinoJson@^6.21.5
